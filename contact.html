<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Web Utility Hub</title>
    <meta name="description" content="Get in touch with the Web Utility Hub team for feedback or support.">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <a href="index.html" class="logo-badge">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg>
                <span>Web Utility Hub</span>
            </a>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="tools/freelance-hourly-rate/">Hourly Rate</a>
                <a href="tools/image-compressor-target/">Compressor</a>
                <a href="tools/json-formatter-validator/">JSON</a>
                <a href="tools/margin-markup-calculator/">Margin</a>
                <a href="tools/css-box-shadow-generator/">Shadows</a>
                <a href="about.html">About</a>
                <a href="contact.html" class="active">Contact</a>
            <a href="https://www.google.com/search?q=YOUR_BMC_LINK" target="_blank" rel="noopener noreferrer" class="bmc-btn">☕ Support Us</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="card standalone-card" style="max-width: 600px; margin: 0 auto;">
            <h1 style="text-align: center;">Contact Us</h1>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 2rem;">Have a feature request, bug report, or business inquiry? Let us know.</p>
            
            <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
                <input type="hidden" name="form-name" value="contact">
                <p style="display: none;"><label>Don't fill this out: <input name="bot-field" /></label></p>
                <div class="input-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required placeholder="Your Name">
                </div>
                
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="you@example.com">
                </div>
                
                <div class="input-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required placeholder="How can we help?"></textarea>
                </div>
                
                <button type="submit" style="width: 100%;">Send Message</button>
            </form>
        </div>
    </main>

    
    <footer style="text-align: center; padding: 2rem 1rem; color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid rgba(255, 255, 255, 0.08); margin-top: 4rem;">
        <p>If you find these tools helpful, consider <a href="https://www.google.com/search?q=YOUR_BMC_LINK" target="_blank" rel="noopener noreferrer" style="color: var(--accent); text-decoration: underline;">buying us a coffee</a> to support hosting and development.</p>
    </footer>
</body>
</html>
